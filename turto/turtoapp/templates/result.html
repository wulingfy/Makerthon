{% extends "navbar.html" %} {% block title %} Result {% endblock %} 
{% block content %}
  <div class="scrollable-list" style="color: white; font-size: 18px;"> 
    <div class="result-page">
      <div class="result-text">
        <h2>Your Analysis Result</h2>
        {{ result }}<br>
      </div>
      <div style="flex: 1;">
        <canvas id="scoreChart"></canvas>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Use the 'score' dictionary passed from Django context
    const scores = {{ score|safe }};
    
    const ctx = document.getElementById('scoreChart').getContext('2d');
  
    const labels = Object.keys(scores);
    const data = Object.values(scores);
  
    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Scores',
                data: data,
                backgroundColor: [
                    'rgba(255, 99, 132, 0.7)',    // red-ish
                    'rgba(54, 162, 235, 0.7)',    // blue-ish
                    'rgba(255, 206, 86, 0.7)'     // yellow-ish
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    stepSize: 1
                }
            }
        }
    });
  </script>

{% endblock %}
